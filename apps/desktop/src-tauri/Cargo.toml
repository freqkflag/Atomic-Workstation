[package]
name = "atomic-workstation"
version = "0.0.1"
description = "Atomic Workstation desktop shell"
authors = ["Atomic"]
edition = "2021"

[lib]
name = "atomic_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
