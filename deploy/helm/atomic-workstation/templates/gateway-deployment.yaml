apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atomic-workstation.fullname" . }}-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.gateway.repository }}:{{ .Values.image.gateway.tag }}"
          ports:
            - containerPort: {{ .Values.service.gateway.port }}
          env:
            - name: ATOMIC_GATEWAY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "atomic-workstation.fullname" . }}-secrets
                  key: gatewayMasterKey
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.gateway.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "atomic-workstation.fullname" . }}-gateway
spec:
  selector:
    app: gateway
  ports:
    - port: {{ .Values.service.gateway.port }}
      targetPort: {{ .Values.service.gateway.port }}
