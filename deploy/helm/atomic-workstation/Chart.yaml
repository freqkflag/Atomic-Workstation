apiVersion: v2
name: atomic-workstation
description: Atomic Workstation self-hosted HA deployment
type: application
version: 0.1.0
appVersion: "0.0.1"

dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
